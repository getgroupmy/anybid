name: Deploy

# Vercel's git integration owns automatic deploys: production on a push to
# main, previews on pull requests. This workflow is the manual alternative —
# run it from the Actions tab to ship a specific commit through the Vercel CLI
# without waiting on the git trigger, or as the basis for gating production on
# CI later.
#
# To gate production on a green CI run instead, add the workflow_run trigger
# below and set git.deploymentEnabled.main to false in vercel.json, or the two
# paths will both deploy:
#
#   workflow_run:
#     workflows: [CI]
#     types: [completed]
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  vercel:
    name: Deploy website to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI verified, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pulls the project's settings and environment variables, so the build
      # here matches the one Vercel would run itself.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
