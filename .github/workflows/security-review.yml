# Anthropic's security reviewer, run over the diff of each pull request.
#
# Needs a CLAUDE_API_KEY repository secret, enabled for both the Claude API and
# Claude Code. Without it the review step is skipped and the job leaves a
# warning saying so, rather than failing.
#
# That is a deliberate middle: a security check must never report "clean" when
# it did not run, but failing hard on a missing secret reds every pull request
# in the repository over something no code change can fix, which under a
# never-merge-red policy stops the project. A skipped step carrying a visible
# warning is honest without being a roadblock. Once the secret exists, a
# genuine review failure still fails the job.
#
# Two further choices:
#
#   * The action is pinned to a commit rather than @main. It receives an API
#     key, so what runs should not change under us without a visible diff.
#
#   * .claude is excluded. It holds skills — prompt text rather than code the
#     marketplace runs — and upstream warn the reviewer is not hardened against
#     prompt injection, so feeding it instruction files is pointing it at the
#     one input it is known to be weak to.
#
# Upstream also recommend setting Settings -> Actions -> "Require approval for
# all external contributors", so a fork pull request cannot run this before a
# maintainer has looked at it.
name: Security review

on:
  pull_request:

permissions:
  pull-requests: write # to leave findings as PR comments
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Lifted to env because the secrets context is not reliably available to a
# step's `if`, while env is.
env:
  CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

jobs:
  review:
    name: Review the diff for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The action diffs against the previous commit, so one parent is
          # needed as well as the head.
          fetch-depth: 2

      - name: Say so when there is no key to review with
        if: env.CLAUDE_API_KEY == ''
        run: |
          echo "::warning title=Security review did not run::No CLAUDE_API_KEY secret is set, so this diff was not reviewed. Add one under Settings -> Secrets and variables -> Actions."

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        if: env.CLAUDE_API_KEY != ''
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          exclude-directories: .claude
