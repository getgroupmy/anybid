name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run without pushing a commit. Running CI by hand is
  # the manual deploy path now: it verifies the commit and then ships it, which
  # beats the old deploy-only workflow that could put an unverified commit live.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anybid
          POSTGRES_PASSWORD: anybid
          POSTGRES_DB: anybid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anybid -d anybid"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://anybid:anybid@localhost:5432/anybid?schema=public
      # Scratch database for `prisma migrate diff`, which replays the
      # migrations somewhere disposable to compare them against the schema.
      SHADOW_DATABASE_URL: postgresql://anybid:anybid@localhost:5432/shadow?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/realtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # @anybid/shared is consumed as build output, so it must exist before
      # anything type-checks, seeds or bundles against it.
      - name: Build shared package
        run: npm run build -w @anybid/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (auction engine)
        run: npm run test -w @anybid/shared

      # Fails if schema.prisma and the migrations have diverged. Without this
      # the schema can gain a field no migration creates: `db push` would still
      # be green here while every production deploy served against a database
      # missing that column.
      - name: Check migrations match the schema
        run: |
          # psql rejects Prisma's ?schema= parameter, so strip the query string.
          psql "${DATABASE_URL%%\?*}" -c 'CREATE DATABASE shadow;'
          npx prisma migrate diff \
            --from-migrations apps/api/prisma/migrations \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      # `migrate deploy` is what the production stack runs, so run it here too.
      # `db push` would diff the schema straight onto the database and leave the
      # migration itself untested.
      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm run db:seed -w @anybid/api

      # These need a migrated database, so they run after the step above. They
      # create and delete their own fixtures rather than leaning on the seed.
      - name: Concurrency tests (bid lock, settlement claim, approval gate)
        run: npm run test -w @anybid/api

      - name: End-to-end smoke test
        run: |
          npm run dev:api &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health >/dev/null && break
            sleep 1
          done
          npx tsx apps/api/scripts/smoke.ts

      - name: Build web
        run: npm run build -w @anybid/web

  # Production deploys come from here rather than from Vercel's git
  # integration, so what reaches production is a commit this workflow verified.
  # The git trigger deploys on a push regardless of the tests — a red commit
  # goes live under a red tick — and that is the difference this job exists to
  # make.
  #
  # Only the website is deployed. The API is a long-lived Fastify server with a
  # WebSocket hub and a five-second settlement tick, which is why it runs as a
  # container on a VM (docker-compose.prod.yml) and not as functions here.
  deploy:
    name: Deploy website to Vercel
    runs-on: ubuntu-latest
    needs: [verify]
    # A pull request is a commit that has not landed; it gets the checks and
    # not the production credentials. Previews still come from Vercel's git
    # integration.
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    timeout-minutes: 30

    # On the job, not the workflow: a newer commit should supersede a deploy
    # still in flight, without cancelling the older commit's tests, which are
    # the record of whether that commit was sound.
    concurrency:
      group: deploy-production
      cancel-in-progress: true

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      # The secrets context is not available to a job-level `if`, so the token
      # is lifted into env and the first step checks it there.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy credentials are present
        id: creds
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # A warning named on the run summary, because the quiet version of
            # this is genuinely misleading: a green tick on a run that deployed
            # nothing looks exactly like a run that deployed something.
            echo "::warning::Nothing was deployed. Missing:$missing"
            {
              echo "### Nothing was deployed"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Vercel's git integration is still enabled, so this commit"
              echo "was deployed by that path instead. Set the secrets above to"
              echo "move production deploys behind these checks."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - name: Install the Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@latest

      # Pulls the project's settings and environment variables, so the build
      # here matches the one Vercel would have run itself.
      - name: Pull the project settings
        if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Something the deployed site can be checked against afterwards, so
      # "did this commit actually reach production" is answerable without
      # trusting the run's own tick. Written into the build output rather than
      # compiled in, so it is readable without executing anything.
      - name: Stamp the build
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p .vercel/output/static
          printf '{"commit":"%s","ref":"%s","run":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .vercel/output/static/build-info.json

      - name: Deploy to production
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          # Retried once. A deploy that fails after the upload has finished —
          # one lost packet talking to Vercel's API — is not a reason to leave
          # the previous bundle live under a green tick. A retry makes a second
          # deployment from the same prebuilt output of the same commit, so the
          # two are identical and the alias lands on whichever succeeded.
          for attempt in 1 2; do
            if url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"); then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              {
                echo "### Deployed to production"
                echo
                echo "$url"
                echo
                echo "Commit \`$GITHUB_SHA\`, verified by this run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt failed"
            sleep 10
          done
          echo "::error::The deploy failed twice; production still serves the previous bundle."
          exit 1

  # The other half of the same rule: a green run releases the API too.
  #
  # The API cannot go to Vercel. It holds bidding WebSockets open and closes
  # auctions on a five-second tick, and functions have neither a socket to hold
  # nor a process to tick — so it runs as containers on a host (api, a single
  # settlement worker, Caddy; docker-compose.prod.yml). This job is how that
  # host gets a release: the same script a person would run by hand, run by CI
  # against the commit it has just verified.
  deploy-api:
    name: Release the API to its host
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    timeout-minutes: 25

    # Queued rather than cancelled, unlike the website. This path runs
    # `prisma migrate deploy`; a cancel between two statements of a migration
    # leaves the schema half applied, which is worse than spending a few
    # minutes on a commit the next run supersedes anyway.
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false

    env:
      SSH_HOST: ${{ secrets.API_SSH_HOST }}
      SSH_USER: ${{ secrets.API_SSH_USER }}
      SSH_KEY: ${{ secrets.API_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.API_SSH_HOST_KEY }}
      API_DOMAIN: ${{ secrets.API_DOMAIN }}
      # Where the repository is checked out on that host. The default is what
      # scripts/deploy-vm.sh tells you to clone into.
      CHECKOUT: ${{ vars.API_CHECKOUT_PATH || '~/anybid' }}

    steps:
      - name: Check the release credentials are present
        id: creds
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing API_SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing API_SSH_USER"
          [ -z "$SSH_KEY" ] && missing="$missing API_SSH_KEY"
          [ -z "$SSH_HOST_KEY" ] && missing="$missing API_SSH_HOST_KEY"
          [ -z "$API_DOMAIN" ] && missing="$missing API_DOMAIN"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The API was not released. Missing:$missing"
            {
              echo "### The API was not released"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "The host key is one of them on purpose. Without it this job"
              echo "would trust whatever key answered on the first connection,"
              echo "which hands the deploy key to anyone able to answer in the"
              echo "host's place. Get the real one with \`ssh-keyscan <host>\`"
              echo "and paste all of its lines into API_SSH_HOST_KEY."
              echo
              echo "Until then the API is released by hand, on the host:"
              echo "\`git pull && ./scripts/deploy-vm.sh \$API_DOMAIN\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authorise the connection
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          # Pinned, not scanned — see the note in the step above.
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts

      # One ssh invocation, so the release is one step from CI's point of view:
      # if any part of it fails, the step fails. deploy-vm.sh is the same script
      # a person runs on the host and is re-runnable — it keeps the existing
      # .env.prod rather than rotating secrets and locking the API out of its
      # own database, waits for the api service to report healthy, and prints
      # the migrate and api logs if it does not.
      - name: Release
        if: steps.creds.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "COMMIT='$GITHUB_SHA' DOMAIN='$API_DOMAIN' CHECKOUT='$CHECKOUT' bash -euo pipefail -s" <<'REMOTE'
          cd "${CHECKOUT/#\~/$HOME}"
          # The branch, not the bare SHA, and no --depth: fetching with a depth
          # turns a full clone on the host into a shallow one, which degrades
          # every later fetch there. This job only runs on main, so the commit
          # is always reachable from it.
          git fetch --quiet origin main
          # Detached, because the host's checkout is a deployment artefact and
          # not somewhere anyone should be committing. .env.prod is ignored by
          # git, so it survives this.
          git checkout --quiet --detach "$COMMIT"
          git --no-pager log --oneline -1
          GIT_COMMIT="$COMMIT" ./scripts/deploy-vm.sh "$DOMAIN"
          REMOTE

      # The step above succeeding means the release script returned, not that
      # this commit is what is now serving: a container that failed to be
      # replaced leaves the previous one up, healthy, and wrong. The image
      # carries the commit it was built from, so ask the live API.
      - name: Check the running API is this commit
        if: steps.creds.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 10); do
            commit=$(curl -fsS --max-time 15 "https://$API_DOMAIN/health" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit??""))}catch{}})' \
              || true)
            [ "$commit" = "$GITHUB_SHA" ] && break
            echo "attempt $attempt: serving '${commit:-no answer}'"
            sleep 6
          done

          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::The API answers, but on commit '${commit:-unknown}' rather than $GITHUB_SHA. The release did not take."
            exit 1
          fi
          {
            echo "### API released"
            echo
            echo "\`https://$API_DOMAIN/health\` reports commit \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
