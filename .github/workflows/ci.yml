name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anybid
          POSTGRES_PASSWORD: anybid
          POSTGRES_DB: anybid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anybid -d anybid"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://anybid:anybid@localhost:5432/anybid?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/realtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (auction engine)
        run: npm run test -w @anybid/shared

      - name: Push schema and seed
        run: |
          npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate
          npm run db:seed -w @anybid/api

      - name: End-to-end smoke test
        run: |
          npm run dev:api &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health >/dev/null && break
            sleep 1
          done
          npx tsx apps/api/scripts/smoke.ts

      - name: Build web
        run: npm run build -w @anybid/web
